version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: ridetogether-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - ridetogether_mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=ridetogether

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: ridetogether-server
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    environment:
      - MONGODB_URI=mongodb://mongodb:27017/ridetogether
      - NODE_ENV=production
      - CLIENT_URL=http://localhost:5173
      - COOKIE_SECURE=false

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: ridetogether-client
    restart: unless-stopped
    depends_on:
      - server
    ports:
      - "5173:80"

volumes:
  ridetogether_mongo_data:
